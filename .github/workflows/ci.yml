name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JDK 17: toolchain for all modules and the minimum supported runtime.
      # JDK 25: Gradle daemon (gradle/gradle-daemon-jvm.properties). The last one listed is the default.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: CLI smoke test
        run: |
          ./gradlew :cli:installDist
          cli/build/install/storepilot/bin/storepilot --version

  # The Android sample builds the plugin from this repository through includeBuild.
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate the listing and check the publish task graph
        working-directory: samples/android-gradle
        run: ./gradlew :app:validateListing :app:publishReleaseBundle --dry-run

  # Runs the action from this checkout, which builds the CLI from source (action/cli-version is "source").
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate the sample listing through the action
        id: validate
        uses: ./
        with:
          command: listing-validate
          metadata-dir: samples/android-gradle/app/store
          # Between a release commit and its published release, action/cli-version names a version
          # that cannot be downloaded yet.
          version: source

      - name: Check the action output
        shell: bash
        env:
          RESULT: ${{ steps.validate.outputs.result }}
        run: |
          echo "$RESULT"
          grep -q '"errors": 0' <<< "$RESULT"
