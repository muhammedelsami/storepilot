# Starts a release when a version tag is pushed (RELEASING.md). Nothing becomes public here: the GitHub
# Release is a draft, and the Maven Central deployment waits in the Central Portal until it is released
# by hand. The Gradle plugin is published afterwards with the "Publish plugin" workflow.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches the version files
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version=$version" gradle.properties \
            || { echo "::error::gradle.properties does not say version=$version."; exit 1; }
          [[ "$(tr -d '[:space:]' < action/cli-version)" == "$version" ]] \
            || { echo "::error::action/cli-version does not say $version."; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew build :cli:shadowJar :cli:shadowDistZip

      - name: Collect the release files
        run: |
          mkdir release
          cp cli/build/libs/storepilot.jar release/
          (cd release && sha256sum storepilot.jar > storepilot.jar.sha256)
          cp "cli/build/distributions/storepilot-shadow-$VERSION.zip" "release/storepilot-$VERSION.zip"

      - name: Create a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft --verify-tag --generate-notes --title "StorePilot $VERSION"

      - name: Upload the core modules to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral
