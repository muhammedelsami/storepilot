name: Publish (keyless)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # for Workload Identity Federation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the release bundle
        run: ./gradlew :app:bundleRelease

      # Sets Application Default Credentials for the steps after it. No key is stored in the repository.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/github/providers/github
          service_account: play-publisher@example-project.iam.gserviceaccount.com

      - name: Publish to Google Play
        uses: muhammedelsami/storepilot@v1
        with:
          artifact: app/build/outputs/bundle/release/*.aab
          metadata-dir: app/store
          track: internal
